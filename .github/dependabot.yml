version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # One pull request for all minor/patch updates instead of one per package.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint supports TypeScript < 6.1; TypeScript majors need a deliberate migration.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep Node type definitions aligned with the Node 22 runtime used in CI.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
